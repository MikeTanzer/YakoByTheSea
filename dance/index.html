<video id="vid" src="sunset.mp4" muted loop playsinline preload="auto" crossorigin="anonymous"></video>
<audio id="song" src="../music/baby-yak.mp3" loop preload="auto" crossorigin="anonymous"></audio>

<script>
(() => {
'use strict';
// ───────────────────────────── the song ─────────────────────────────
// Beat grid measured offline from music/baby-yak.mp3 (comb-filter tempo/phase search over the whole track):
// 92.44 BPM, kicks on beats 1 and 3, first downbeat 0.889 s.
const BPM = 92.44, BEAT = 60 / BPM, BAR = BEAT * 4, PHASE = 0.240, T0 = PHASE + BEAT;
const LOOP = 7.29;                                 // sunset.mp4 is a seamless 7.29 s loop
const VRATE = LOOP / (3 * BAR);                    // …played so that one loop = three bars of the song

const $ = (id) => document.getElementById(id);
const canvas = $('gl'), song = $('song'), vid = $('vid');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fail = (m) => { $('errmsg').textContent = m; $('err').classList.add('show'); throw new Error(m); };
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
if (!gl) fail('It needs WebGL 2, which this browser does not offer.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('It needs floating-point render targets (EXT_color_buffer_float).');

// ───────────────────────────── shaders ─────────────────────────────
// Every particle has a fixed HOME on the painting and takes its colour from the video at that home.
// The state holds only its offset from home and its velocity, so when a vortex or the gyroid moves a
// particle it carries its colour with it — the painting itself gets stirred — and springs bring it back.
const MAXV = 8;
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float u01(uint h){ return float(h) * (1.0 / 4294967296.0); }
uniform vec2 uHalf;                       // world half-size of the painting (it covers the screen)
vec2 homeUV(uint id){ uint h = pcg(id); float a = u01(h); return vec2(a, u01(pcg(h))); }
vec2 homeOf(vec2 uv){ return vec2((uv.x - 0.5) * 2.0 * uHalf.x, (0.5 - uv.y) * 2.0 * uHalf.y); }
vec3 rainbow(float h){ return 0.5 + 0.5 * cos(6.2831853 * (h + vec3(0.0, 0.33, 0.67))); }
// The 3D gyroid sculpture. Each particle starts from its own spot on the painting (x, y) at a random
// depth, is pulled onto the surface G = 0 by Newton steps, then the cube is turned and put in perspective.
uniform float uSculpt, uYaw, uPitch, uSc;
vec3 gyroidOnto(vec3 p){
  for (int i = 0; i < 3; i++) {
    vec3 s = sin(p), c = cos(p);
    float G = s.x * c.y + s.y * c.z + s.z * c.x;
    vec3 g = vec3(c.x * c.y - s.z * s.x, c.y * c.z - s.x * s.y, c.z * c.x - s.y * s.z);
    vec3 st = G * g / (dot(g, g) + 0.25);           // damped: near saddle points grad G -> 0 and a raw step explodes
    float sl = length(st); p -= st * min(1.0, 0.7 / (sl + 1e-6));
  }
  return p; }
const float GS = 1.5 * 3.14159265;                     // one and a half periods across the cube
vec3 seedOf(uint id, vec2 uv){ return vec3((uv.x - 0.5) * 2.0, (0.5 - uv.y) * 2.0, u01(pcg(id ^ 0xc2b2ae35u)) * 2.0 - 1.0); }
vec3 turn(vec3 p){
  float cy = cos(uYaw), sy = sin(uYaw), cp = cos(uPitch), sp = sin(uPitch);
  p = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
  return vec3(p.x, cp * p.y - sp * p.z, sp * p.y + cp * p.z); }
vec3 sculptOf(uint id, vec2 uv){                       // returns screen xy (world units) and depth
  vec3 p = clamp(gyroidOnto(seedOf(id, uv) * GS) / GS, -1.25, 1.25);
  float cy = cos(uYaw), sy = sin(uYaw), cp = cos(uPitch), sp = sin(uPitch);
  p = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
  p = vec3(p.x, cp * p.y - sp * p.z, sp * p.y + cp * p.z);
  return vec3(p.xy * (3.2 / (3.2 + p.z)) * uSc, p.z); }
`;
const VS_QUAD = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const FS_UPDATE = HEAD + `
uniform sampler2D uState; uniform int uW, uInit, uNV; uniform float uN, uA;
uniform float uT, uPT, uDt, uK, uDrag, uGyA, uGyK, uGyF, uGyZ, uBeatT, uRip;
uniform vec2 uRipC; uniform vec4 uV[${MAXV}];
out vec4 o;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy); uint id = uint(c.y * uW + c.x);
  vec2 huv = homeUV(id), H = homeOf(huv); uint h = pcg(id ^ 0x9e3779b9u); float r1 = u01(h), r2 = u01(pcg(h));
  if (uInit == 1) {                                     // begin as a turning galaxy and fall into the painting
    float a = r1 * 6.2831853 + r2 * 9.0, rad = 0.1 + pow(r2, 0.6) * 1.4;
    o = vec4(vec2(cos(a) * rad * uA * 0.6, sin(a) * rad * 0.6) - H, vec2(-sin(a), cos(a)) * 0.3 * rad); return;
  }
  vec4 s = texelFetch(uState, c, 0); vec2 off = s.xy, v = s.zw, P = H + off;

  // ── the gyroid: G = sin x cos y + sin y cos z + sin z cos x, sliced at depth z (which moves in time)
  vec3 q = vec3(P * uGyF, uGyZ);
  float sx = sin(q.x), cx = cos(q.x), sy = sin(q.y), cy = cos(q.y), sz = sin(q.z), cz = cos(q.z);
  float G = sx * cy + sy * cz + sz * cx;
  vec2 dG = vec2(cx * cy - sz * sx, cy * cz - sx * sy) * uGyF;          // ∇G in world units
  float gl2 = dot(dG, dG) + 1e-4, gn = sqrt(gl2);
  vec2 u = vec2(dG.y, -dG.x) / uGyF * uGyA;                               // flow along the labyrinth: curl of G, divergence-free

  // ── vortices: Lamb–Oseen, v = Γ / 2πr · (1 − e^(−r²/rc²)), with a little drain for spiral arms
  for (int i = 0; i < ${MAXV}; i++) {
    if (i >= uNV) break;
    vec4 V = uV[i]; vec2 dp = P - V.xy; float r2v = dot(dp, dp) + 1e-6, r = sqrt(r2v);
    float sp = V.z / (6.2831853 * r) * (1.0 - exp(-r2v / (V.w * V.w))) * exp(-r2v / (V.w * V.w * 10.0));
    u += vec2(-dp.y, dp.x) / r * sp - dp / r * abs(sp) * 0.16;
  }

  float dt = uDt;
  v += (u - v) * uDrag * dt;                            // carried by the flow
  vec2 tgt = vec2(0.0); float ks = uK;                 // pulled home — or, at the climax, onto the 3D gyroid
  if (uSculpt > 0.001) { vec3 sc = sculptOf(id, huv); tgt = (sc.xy - H) * uSculpt; ks = mix(uK, 34.0, uSculpt); }
  v += -(off - tgt) * ks * dt;
  v += -(G / gn) * (dG / gn) * uGyK * dt;              // drawn onto the gyroid's zero surface
  v *= exp(-2.0 * sqrt(ks + uGyK) * 0.42 * dt);
  // the kick sends a ripple out across the painting from the sun
  vec2 rd = H - uRipC; float dist = length(rd);
  float hit = uBeatT + dist * 0.32 + r1 * 0.01;
  if (hit > uPT && hit <= uT) v += rd / (dist + 1e-4) * uRip * (0.6 + 0.8 * r2) * exp(-dist * 0.6);
  float vl = length(v); if (vl > 6.0) v *= 6.0 / vl;
  off += v * dt;
  float ol = length(off); if (ol > 2.8) off *= 2.8 / ol;
  o = vec4(off, v);
}`;

const VS_DRAW = HEAD + `
uniform sampler2D uState, uVideo; uniform int uW; uniform float uN, uA, uT, uI, uPsy, uHigh, uDusk, uKick;
out vec3 vC;
void main(){
  uint id = uint(gl_VertexID); ivec2 c = ivec2(int(id % uint(uW)), int(id / uint(uW)));
  vec4 s = texelFetch(uState, c, 0);
  vec2 uv = homeUV(id), P = homeOf(uv) + s.xy;
  uint h = pcg(id ^ 0x85ebca6bu); float r3 = u01(h);
  vec3 col = texture(uVideo, uv).rgb; col *= col;                        // the painting, in linear light
  // the song is the sunset: golden hour → dusk → night, with stars coming out in the sky
  float sky = smoothstep(0.44, 0.28, uv.y);
  col = mix(col, col * vec3(0.36, 0.40, 0.92) * (0.55 + 0.45 * (1.0 - sky)) + vec3(0.004, 0.003, 0.02), uDusk * 0.85);
  float star = step(0.9962, r3) * sky * uDusk * (0.55 + 0.45 * sin(uT * 3.1 + r3 * 900.0));
  col += vec3(0.9, 0.95, 1.0) * star * 7.0 * (1.0 + uHigh * 1.5);
  vec2 sd = (uv - vec2(0.485, 0.30)) * vec2(1.78, 1.0);                  // the sun breathes on the kick
  col *= 1.0 + exp(-dot(sd, sd) * 55.0) * uKick * 1.6 * (1.0 - uDusk * 0.7);
  // psychedelic only where the physics acts: the further a particle is stirred, the more rainbow it glows
  float d = length(s.xy), spd = length(s.zw), luma = max(max(col.r, col.g), col.b);
  float fx = smoothstep(0.012, 0.22, d + spd * 0.08) * uPsy;
  col = mix(col, rainbow(d * 4.0 + spd * 0.6 + uT * 0.12 + r3 * 0.25) * (0.35 + 1.15 * luma), fx * 0.65);
  col *= 1.0 + step(0.985, r3) * uHigh * 3.0;                            // hi-hats glint on the water
  if (uSculpt > 0.001) {                                                  // light the sculpture: near is warm, far is deep blue
    float near = clamp(0.5 - turn(seedOf(id, uv)).z * 0.55, 0.0, 1.0);
    vec3 tint = mix(vec3(0.08, 0.16, 0.6), vec3(1.0, 0.6, 0.22), near);
    col = mix(col, col * (0.25 + 1.3 * near) * mix(vec3(0.7, 0.8, 1.25), vec3(1.2, 1.0, 0.8), near) + tint * 0.04, uSculpt * 0.9);
  }
  gl_Position = vec4(P.x / uA, P.y, 0.0, 1.0); gl_PointSize = 1.0;
  vC = col * uI;
}`;
const FS_DRAW = `#version 300 es
precision highp float; in vec3 vC; out vec4 o; void main(){ o = vec4(vC, 1.0); }`;

// Trails: the old trail nudged bigger, turned a touch and hue-rotated, faded, with this frame poured in.
const FS_FEED = `#version 300 es
precision highp float; uniform sampler2D uPrev, uFresh; uniform vec2 uRes; uniform float uDecay, uZoom, uRot, uHue; out vec4 o;
vec3 hueRot(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a), sa = sin(a); return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca); }
void main(){
  float asp = uRes.x / uRes.y; vec2 uv = gl_FragCoord.xy / uRes;
  vec2 q = (uv - 0.5) * vec2(asp, 1.0); float ca = cos(uRot), sa = sin(uRot);
  q = mat2(ca, sa, -sa, ca) * q / uZoom;
  vec3 c = hueRot(texture(uPrev, q / vec2(asp, 1.0) + 0.5).rgb, uHue);
  if (any(isnan(c)) || any(isinf(c))) c = vec3(0.0);
  o = vec4(clamp(c, 0.0, 64.0) * uDecay + texture(uFresh, uv).rgb * (1.0 - uDecay), 1.0);
}`;
const FS_DOWN = `#version 300 es
precision highp float; uniform sampler2D uSrc; uniform vec2 uTx; out vec4 o;

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fresh); gl.uniform1i(F.uFresh, 1);
  gl.uniform2f(F.uRes, VW, VH); gl.uniform1f(F.uDecay, decay);
  gl.uniform1f(F.uZoom, 1.0 + (0.0015 + 0.006 * lv.bass) * f60); gl.uniform1f(F.uRot, 0.002 * Math.sin(t * 0.21) * f60);
  gl.uniform1f(F.uHue, (0.02 + 0.04 * lv.high) * f60 * P.psy);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  tc = 1 - tc;

  present(t);
  fpsN++; fpsT += dt; if (fpsT > 0.5) { $('fps').textContent = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
}
function present(t) {
  let src = trail[tc];
  gl.useProgram(P_DOWN.p);
  for (let i = 0; i < blooms.length; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomF[i]); gl.viewport(0, 0, blooms[i].w, blooms[i].h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform1i(P_DOWN.u.uSrc, 0);
    gl.uniform2f(P_DOWN.u.uTx, 1 / (2 * blooms[i].w), 1 / (2 * blooms[i].h));
    gl.drawArrays(gl.TRIANGLES, 0, 3); src = blooms[i].t;
  }
  gl.useProgram(P_UP.p); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = blooms.length - 1; i > 0; i--) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomF[i - 1]); gl.viewport(0, 0, blooms[i - 1].w, blooms[i - 1].h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, blooms[i].t); gl.uniform1i(P_UP.u.uSrc, 0);
    gl.uniform2f(P_UP.u.uTx, 1 / blooms[i - 1].w, 1 / blooms[i - 1].h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, VW, VH);
  const C = P_COMP.u; gl.useProgram(P_COMP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[tc]); gl.uniform1i(C.uTrail, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fresh); gl.uniform1i(C.uFresh, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, blooms[0].t); gl.uniform1i(C.uBloom, 2);
  gl.uniform2f(C.uRes, VW, VH); gl.uniform1f(C.uMix, REDUCED ? P.mix * 0.5 : P.mix); gl.uniform1f(C.uBloomK, 0.12);
  gl.uniform1f(C.uCA, REDUCED ? 0 : 0.002 + 0.006 * lv.bass * P.psy);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
let lastT = 0;
function loop(now) { if (ready) { if (HOLD) present(lastT); else { frame(now); lastT = nowT(); } } requestAnimationFrame(loop); }

// ───────────────────────────── boot ─────────────────────────────
buildState(+$('q').value); buildScreen();
addEventListener('resize', buildScreen);
$('q').addEventListener('change', (e) => buildState(+e.target.value));
$('mute').addEventListener('click', () => { muted = !muted; if (gain) gain.gain.value = muted ? 0 : 1; else song.muted = muted;
  $('mute').textContent = muted ? '🔇' : '🔊'; $('mute').setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music'); });
$('pause').addEventListener('click', () => {
  if (!started) return;
  paused = !paused;
  if (paused) { song.pause(); vid.pause(); playing = false; } else { song.play(); vid.play(); playing = true; }
  $('pause').textContent = paused ? '▶' : '⏸'; $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
});
$('go').addEventListener('click', async () => {
  setupAudio(); try { await actx.resume(); } catch (e) {}
  try {
    song.currentTime = 0; vid.currentTime = 0; vid.playbackRate = VRATE;
    await Promise.all([song.play(), vid.play()]); playing = true; started = true; clock = 0; prevT = 0;
  } catch (e) { $('st').textContent = 'Tap again to start the music.'; return; }
  $('gate').classList.add('gone');
});
(async () => {
  $('prog').style.width = '30%';
  await new Promise((res, rej) => {
    if (vid.readyState >= 2) return res();
    vid.addEventListener('loadeddata', res, { once: true });
    vid.addEventListener('error', () => rej(new Error('the sunset video did not load')), { once: true });
  }).catch((e) => fail('Could not load the animation (' + e.message + ').'));
  $('prog').style.width = '100%';
  try { vid.playbackRate = VRATE; await vid.play(); } catch (e) {}   // muted, so it may run before the music starts
  ready = true; requestAnimationFrame(loop);
  $('go').disabled = false; $('go').textContent = '▶ Start the music'; $('st').textContent = 'Turn your sound up — then drag to stir the sea.';
  const qs = new URLSearchParams(location.search);
  if (qs.has('at')) { $('gate').style.display = 'none'; window.__sunset.at(+qs.get('at'), +(qs.get('settle') || 300)); document.title = 'ready'; }
})();

// Hooks for automated checks.
window.__sunset = {
  hold(on) { HOLD = !!on; },
  stats: () => ({ particles: N, ready, sculpt: +sculpt.toFixed(2), dusk: +dusk.toFixed(2), vx: vortices.map(v => [+v.x.toFixed(2), +v.y.toFixed(2)]), video: { ready: vid.readyState, t: +vid.currentTime.toFixed(2), rate: vid.playbackRate }, vortices: vortices.length, err: gl.getError() }),
  probe() {
    const scan = (fb, w, h) => { gl.bindFramebuffer(gl.FRAMEBUFFER, fb); const W = Math.min(w, 256), H = Math.min(h, 256), px = new Float32Array(W * H * 4);
      gl.readPixels(Math.floor((w - W) / 2), Math.floor((h - H) / 2), W, H, gl.RGBA, gl.FLOAT, px);
      let nan = 0, max = 0, sum = 0; for (const v of px) { if (!Number.isFinite(v)) nan++; else { if (v > max) max = v; sum += v; } }
      return { nan, max: +max.toFixed(3), mean: +(sum / px.length).toFixed(4) }; };
    return { state: scan(stateF[cur], SW, SW), fresh: scan(freshF, VW, VH), trail: scan(trailF[tc], VW, VH), err: gl.getError() };
  },
  at(t, settle = 120) {                             // simulate the run-up to song time t, draw it, hold the frame
    HOLD = true; song.pause(); manualClock = true; playing = true; started = true;
    clock = Math.max(0, t - settle / 60); prevT = clock; lastBeat = Math.floor((clock - PHASE) / BEAT); vortices = []; finger = null;
    for (let i = 0; i < settle; i++) { clock = Math.min(t, clock + 1 / 60); frame(performance.now(), 1 / 60); }
    lastT = t; playing = false; manualClock = false;
    return { t, caption: capT, vortices: vortices.length, err: gl.getError() };
  }
};
})();
