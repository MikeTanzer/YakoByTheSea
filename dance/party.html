<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yako's Particle Dance Party</title>
<meta name="description" content="Five million particles dance, laugh, point and puzzle along with Yako to Baby Yak.">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  :root { --gold:#f4c35a; --gold-d:#cba24a; --ink:#0a1636; --cream:#fdf3d6; --sea:#7fd3f2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050d24; color: var(--cream); overflow: hidden;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #gate { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: radial-gradient(120% 90% at 50% 40%, rgba(8,20,56,.35), rgba(3,8,22,.82));
    transition: opacity .6s ease; }
  #gate.gone { opacity: 0; pointer-events: none; }
  .card { text-align: center; padding: 28px 30px 24px; max-width: min(92vw, 520px); }
  .card h1 { margin: 0; font-weight: 800; font-size: clamp(38px, 7.4vw, 78px); line-height: .95;
    color: var(--gold); text-shadow: 0 4px 0 #8a5a12, 0 10px 34px rgba(244,195,90,.35); letter-spacing: .5px; }
  .card h1 span { display: block; color: var(--sea); font-size: .5em; text-shadow: 0 3px 0 #1d5a78; margin-top: .18em; }
  .card p { margin: 16px auto 0; font-size: 18px; line-height: 1.35; color: #dfe9ff; max-width: 34ch; }
  .card .count { font-variant-numeric: tabular-nums; color: var(--gold); }
  #go { margin-top: 22px; font: 800 22px/1 'Baloo 2', sans-serif; padding: 16px 30px 13px; border-radius: 999px;
    border: 3px solid #fff3c4; background: linear-gradient(#ffd977, #e7a531); color: #4a2a00; cursor: pointer;
    box-shadow: 0 6px 0 #9a6115, 0 14px 30px rgba(0,0,0,.35); }
  #go:disabled { filter: grayscale(.6) brightness(.8); cursor: progress; }
  #go:focus-visible, .hud button:focus-visible, .hud select:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }
  .bar { height: 6px; width: 260px; max-width: 70vw; margin: 18px auto 0; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sea), var(--gold)); transition: width .2s; }
  .status { margin-top: 8px; font-size: 14px; color: #9fb3dc; min-height: 1.2em; }

  #cap { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-weight: 800; font-size: clamp(18px, 2.6vw, 30px); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 18px rgba(127,211,242,.45);
    white-space: nowrap; pointer-events: none; z-index: 3; transition: opacity .25s; }
  .hud { position: fixed; z-index: 4; display: flex; gap: 8px; align-items: center; font-size: 13px;
    padding: max(10px, env(safe-area-inset-top)) 12px 0; color: #b8c8ec; }
  .hud.l { left: 0; top: 0; font-variant-numeric: tabular-nums; }
  .hud.r { right: 0; top: 0; }
  .hud b { color: var(--gold); font-weight: 800; }
  .hud a.swap { color: var(--cream); text-decoration: none; font: 700 14px 'Baloo 2', sans-serif; background: rgba(10,22,54,.62);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 12px 4px; }
  .hud button, .hud select { font: 700 14px 'Baloo 2', sans-serif; color: var(--cream); background: rgba(10,22,54,.62);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 12px 4px; cursor: pointer; }
  .hud select { padding: 6px 10px 4px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 9; background: #050d24; }
  #err.show { display: grid; }
  @media (max-width: 560px) { .hud.l span.fps { display: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="gate" role="dialog" aria-labelledby="gt">
  <div class="card">
    <h1 id="gt">Yako by the Sea<span>Particle Dance Party</span></h1>
    <p>Yako dances, laughs, points and puzzles to <em>Baby Yak</em> — drawn with <b class="count" id="pc">5,308,416</b> particles.</p>
    <button id="go" type="button" disabled>Loading…</button>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div class="status" id="st" role="status">Painting Yako into particles…</div>
  </div>
</div>

<div id="cap" aria-live="polite"></div>

<div class="hud l"><span><b id="hc">5,308,416</b> particles</span><span class="fps">· <span id="fps">–</span> fps</span></div>
<div class="hud r">
  <a class="swap" href="./">Sunset ↗</a>
  <select id="q" aria-label="Particle count">
    <option value="2304" selected>5.3M</option>
    <option value="1536">2.4M</option>
    <option value="1024">1.0M</option>
  </select>
  <button id="mute" type="button" aria-label="Mute music">🔊</button>
  <button id="pause" type="button" aria-label="Pause">⏸</button>
</div>
<div id="err"><div><h2>This device can't run the particle party</h2><p id="errmsg"></p></div></div>

<audio id="song" src="../music/baby-yak.mp3" loop preload="auto" crossorigin="anonymous"></audio>

<script>
(() => {
'use strict';
// ───────────────────────────── the song's beat grid ─────────────────────────────
// Measured offline from music/baby-yak.mp3 with a comb-filter tempo/phase search over the whole
// track: 92.44 BPM, on-beat onsets 1.49× stronger than off-beat, halves agree within 0.054 s.
// Kicks land on beats 1 and 3 of each bar; the first downbeat is at 0.889 s.
const BPM = 92.44, BEAT = 60 / BPM, PHASE = 0.240, T0 = PHASE + BEAT;   // T0 = first downbeat

// ───────────────────────────── constants ─────────────────────────────
const CW = 384, CH = 512, ANCHOR = CW * 0.40, BASE = CH - 8;   // atlas cell, shirt-centre anchor, feet line
const L = 32768, LW = 256, LH = 128;                           // samples per frame, as a 256×128 layer
const PW = 640, PH = 512;                                      // props canvas
const ROLE_Y = 0.68, ROLE_P = 0.86;                            // fractions of particles: Yako | props | sea+stars
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let SNAP = false, FORCE_YL = -1;  // diagnostics: snap particles onto targets / force a Yako frame

const $ = (id) => document.getElementById(id);
const canvas = $('gl'), song = $('song');
const fail = (m) => { $('errmsg').textContent = m; $('err').classList.add('show'); throw new Error(m); };

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
if (!gl) fail('It needs WebGL 2, which this browser does not offer.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('It needs floating-point render targets (EXT_color_buffer_float).');

// ───────────────────────────── shaders ─────────────────────────────
// Each particle stores only an OFFSET from its target, plus a velocity. Both passes recompute the
// target from the same hash, so within an animation Yako is always crisp (offsets carry over while the
// targets update), and on a change of pose the old position is folded into the offset — the particle
// keeps its place on screen and visibly flies to its new spot.
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D; precision highp usampler2DArray;
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float u01(uint h){ return float(h) * (1.0 / 4294967296.0); }
const float ANCHOR = ${ANCHOR.toFixed(1)}, BASE = ${BASE.toFixed(1)}, RY = ${ROLE_Y}, RP = ${ROLE_P};
uniform usampler2DArray uYako, uProps;
uniform int uYL, uYL2, uPL; uniform float uYF;
uniform vec2 uYO, uPO, uHalo; uniform float uYS, uPS, uT, uA, uSea, uBass;
struct R { float r0, r1, r2, r3, r4, r5, r6; };
R rnd(uint id){ R r; uint h = pcg(id); r.r0 = u01(h); h = pcg(h); r.r1 = u01(h); h = pcg(h); r.r2 = u01(h); h = pcg(h); r.r3 = u01(h);
  h = pcg(h); r.r4 = u01(h); h = pcg(h); r.r5 = u01(h); h = pcg(h); r.r6 = u01(h); return r; }
int roleOf(float f){ return f < RY ? 0 : (f < RP ? 1 : 2); }
vec2 yakoAt(int layer, vec2 origin, float r0, out uvec4 tx){
  int j = int(r0 * 32768.0); tx = texelFetch(uYako, ivec3(j & 255, j >> 8, layer), 0);
  return origin + vec2(float(tx.x) - ANCHOR, BASE - float(tx.y)) * uYS; }
vec2 propsAt(int layer, vec2 origin, float scale, float r0, out uvec4 tx){
  int j = int(r0 * 32768.0); tx = texelFetch(uProps, ivec3(j & 255, j >> 8, layer), 0);
  return origin + vec2(float(tx.x), -float(tx.y)) * scale; }
vec2 fireflyAt(float r1, float r2, float r3){            // ~1500 glowing clusters looping around Yako
  uint fk = pcg(uint(r1 * 1500.0) + 77u); float q1 = u01(fk); fk = pcg(fk); float q2 = u01(fk); fk = pcg(fk); float q3 = u01(fk); fk = pcg(fk); float q4 = u01(fk);
  float a = q1 * 6.2831853 + uT * (0.06 + 0.16 * q2) * (q3 < 0.5 ? 1.0 : -1.0);
  return uHalo + vec2(cos(a) * (0.75 + 0.95 * q3), sin(a + q2 * 6.2831853) * (0.42 + 0.5 * q4)) + (vec2(r2, r3) - 0.5) * 0.012; }
vec2 seaAt(float r2, float r3){
  float x = (r2 * 2.0 - 1.0) * uA * 1.06, dep = pow(r3, 1.25);
  float w = sin(x * 3.1 + uT * 1.3) * 0.5 + sin(x * 7.3 - uT * 2.1) * 0.25 + sin(x * 13.7 + uT * 3.3) * 0.12;
  return vec2(x, uSea - dep * 0.24 + w * (0.016 + 0.055 * uBass) * (1.0 - dep)); }
vec2 starAt(float r0, float r2){
  uint sk = pcg(uint(r2 * 700.0) + 991u);
  return vec2((u01(sk) * 2.0 - 1.0) * uA * 1.02, mix(0.05, 1.02, u01(pcg(sk)))) + (vec2(r0, fract(r0 * 91.7)) - 0.5) * 0.011; }
vec2 targetOf(int role, R r, out uvec4 tx){
  tx = uvec4(0u);
  if (role == 0) return yakoAt(r.r4 < uYF ? uYL2 : uYL, uYO, r.r0, tx);   // dithered dissolve between two frames
  if (role == 1) return uPL >= 0 ? propsAt(uPL, uPO, uPS, r.r0, tx) : fireflyAt(r.r1, r.r2, r.r3);
  return r.r1 < 0.74 ? seaAt(r.r2, r.r3) : starAt(r.r0, r.r2);
}
vec3 rainbow(float h){ return 0.5 + 0.5 * cos(6.2831853 * (h + vec3(0.0, 0.33, 0.67))); }
`;
const VS_QUAD = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const FS_UPDATE = HEAD + `
uniform sampler2D uState;
uniform int uW, uInit, uSnap, uYMorph, uPMorph, uYLp, uPLp; uniform float uN;
uniform vec2 uYOp, uPOp, uBurstC; uniform float uPSp;
uniform float uPT, uDt, uBeatT, uAmp, uFeet, uFigH, uBurstT, uSwirl;
out vec4 o;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy); uint id = uint(c.y * uW + c.x);
  int role = roleOf(float(id) / uN); R r = rnd(id);
  uvec4 tx; vec2 T = targetOf(role, r, tx);
  if (uInit == 1) {                                          // start as a slowly turning galaxy
    float a = r.r0 * 6.2831853 + r.r1 * 9.0, rad = 0.15 + pow(r.r1, 0.6) * 1.35;
    o = vec4(vec2(cos(a) * rad * uA * 0.62, sin(a) * rad * 0.62) - T, vec2(-sin(a), cos(a)) * 0.35 * rad); return;
  }
  vec4 s = texelFetch(uState, c, 0); vec2 off = s.xy, v = s.zw;
  if (role == 0 && uYMorph == 1) { uvec4 tp; off += yakoAt(uYLp, uYOp, r.r0, tp) - T; v += (vec2(r.r5, r.r6) - 0.5) * 1.6; }
  if (role == 1 && uPMorph == 1) { uvec4 tp; off += (uPLp >= 0 ? propsAt(uPLp, uPOp, uPSp, r.r0, tp) : fireflyAt(r.r1, r.r2, r.r3)) - T; v += (vec2(r.r5, r.r6) - 0.5) * 1.2; }
  if (uSnap == 1) { o = vec4(0.0); return; }
  float k = 3.0, damp = 2.5;
  if (role == 0) { k = 58.0; damp = 11.4; }
  else if (role == 1) { if (uPL >= 0) { k = 55.0; damp = 11.0; } else { k = 4.0; damp = 2.2; } }
  else if (r.r1 < 0.74) { k = 38.0; damp = 9.0; }
  float dt = uDt;
  v += -off * k * dt; v *= exp(-damp * dt);
  if (role < 2) {
    vec2 P = T + off; float far = smoothstep(0.02, 0.45, length(off));
    vec2 q = P * 2.2; float tt = uT * 0.35;
    v += vec2(-sin(q.x + tt) * sin(q.y * 1.3 - tt) * 1.3, -cos(q.x + tt) * cos(q.y * 1.3 - tt)) * far * uSwirl * dt;
    // the beat lands at the feet first and ripples up to the head
    float hit = uBeatT + clamp((T.y - uFeet) / uFigH, 0.0, 1.0) * 0.10 + r.r1 * 0.015;
    if (hit > uPT && hit <= uT) v.y -= uAmp * (0.75 + 0.5 * r.r2);
    if (role == 1 && uBurstT > uPT && uBurstT <= uT)
      v += normalize(P - uBurstC + (vec2(r.r2, r.r3) - 0.5) * 0.06) * (1.1 + 2.4 * r.r3) + vec2(0.0, 0.7);
  } else if (r.r1 < 0.74) {
    float hit = uBeatT + abs(T.x) * 0.06;
    if (hit > uPT && hit <= uT) v.y += uAmp * 0.55 * (1.0 - pow(r.r3, 1.25));
  }
  off += v * dt;
  o = vec4(off, v);
}`;

const VS_DRAW = HEAD + `
uniform sampler2D uState; uniform int uW; uniform float uN;
uniform float uPt, uYI, uPI, uSI, uKI, uYJ, uPJ, uHigh, uFlash, uPFlash, uRainbow, uGain;
out vec3 vC;
vec3 lin(uvec4 t){ vec3 c = vec3(float(t.z >> 8u), float(t.z & 255u), float(t.w >> 8u)) / 255.0; return c * c; }
void main(){
  uint id = uint(gl_VertexID); ivec2 c = ivec2(int(id % uint(uW)), int(id / uint(uW)));
  vec4 s = texelFetch(uState, c, 0); int role = roleOf(float(id) / uN); R r = rnd(id);
  uvec4 tx; vec2 T = targetOf(role, r, tx);
  vec2 p = T + s.xy, jit = vec2(r.r5, r.r6) - 0.5; float spd = length(s.zw);
  float fly = smoothstep(0.12, 0.9, spd);                  // in flight: glow the colour of its direction
  vec3 flyC = rainbow(r.r1 * 0.85 + atan(s.w, s.z + 1e-7) * 0.05 + uT * 0.2) * 1.4, col;
  if (role == 0) {
    col = lin(tx); p += jit * uYJ;
    float luma = max(max(col.r, col.g), col.b);
    float band = 0.5 + 0.5 * sin((T.y * 2.6 + T.x * 1.4 - uT * 1.7) * 3.14159);   // rainbow bands sweeping through him
    col = mix(col, rainbow(T.y * 0.55 + T.x * 0.3 + uT * 0.22) * (0.35 + 0.9 * luma), uRainbow * smoothstep(0.62, 1.0, band));
    col = mix(col, flyC * (0.4 + luma), fly * 0.8);
    float sparkle = step(0.972, r.r6) * uHigh * (0.5 + 0.5 * sin(uT * 13.0 + r.r1 * 40.0));
    col *= uYI * (1.0 + uFlash + sparkle * 5.0);
  } else if (role == 1) {
    if (uPL >= 0) { col = lin(tx); p += jit * uPJ; col = mix(col, flyC, fly * 0.8) * uPI * (1.0 + uFlash * 0.6 + uPFlash); }
    else {
      float fk = float(uint(r.r1 * 1500.0)), tw = sin(uT * 2.6 + fk * 1.7);
      col = rainbow(fk * 0.0618 + uT * 0.12) * uKI * (0.35 + 0.65 * tw * tw);
      col = mix(col, flyC * uKI * 2.0, fly * 0.6);
    }
  } else if (r.r1 < 0.74) {
    float dep = pow(r.r3, 1.25);
    col = mix(rainbow(T.x * 0.18 + uT * 0.07 + dep * 0.6) * 0.9, vec3(0.015, 0.09, 0.32), sqrt(dep));
    col *= uSI * (0.75 + uBass * 0.9) * (dep < 0.02 ? 1.5 : 1.0);
    p += jit * 0.004;
  } else {
    float sk = float(uint(r.r2 * 700.0));
    float tw = 0.3 + 0.7 * smoothstep(0.2, 1.0, sin(uT * (0.8 + fract(sk * 0.37) * 2.5) + sk));
    col = mix(vec3(0.85, 0.9, 1.0), rainbow(sk * 0.13 + uT * 0.05), 0.6) * uKI * tw * (1.0 + uHigh * 1.8 * step(0.75, fract(sk * 0.73)));
  }
  gl_Position = vec4(p.x / uA, p.y, 0.0, 1.0); gl_PointSize = uPt; vC = col * uGain;
}`;
const FS_DRAW = `#version 300 es
precision highp float; in vec3 vC; out vec4 o; void main(){ o = vec4(vC, 1.0); }`;

// Video feedback: last frame, nudged bigger, turned a little and hue-rotated, then faded — so anything
// that moves leaves rainbow trails tunnelling out of the picture.
const FS_FEED = `#version 300 es
precision highp float; uniform sampler2D uPrev, uFresh; uniform vec2 uRes, uC; uniform float uDecay, uZoom, uRot, uHue; out vec4 o;
vec3 hueRot(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a), sa = sin(a); return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca); }
void main(){
  float asp = uRes.x / uRes.y; vec2 uv = gl_FragCoord.xy / uRes;
  vec2 q = (uv - uC) * vec2(asp, 1.0); float ca = cos(uRot), sa = sin(uRot);
  q = mat2(ca, sa, -sa, ca) * q / uZoom;
  vec3 c = hueRot(texture(uPrev, q / vec2(asp, 1.0) + uC).rgb, uHue);
  if (any(isnan(c)) || any(isinf(c))) c = vec3(0.0);
  o = vec4(clamp(c, 0.0, 64.0) * uDecay + texture(uFresh, uv).rgb * (1.0 - uDecay), 1.0);
}`;
const FS_DOWN = `#version 300 es
precision highp float; uniform sampler2D uSrc; uniform vec2 uTx; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy * uTx * 2.0; vec2 h = uTx;
  vec3 c = texture(uSrc, uv).rgb * 4.0 + texture(uSrc, uv - h).rgb + texture(uSrc, uv + h).rgb
         + texture(uSrc, uv + vec2(h.x, -h.y)).rgb + texture(uSrc, uv - vec2(h.x, -h.y)).rgb;
  o = vec4(c / 8.0, 1.0); }`;
const FS_UP = `#version 300 es
precision highp float; uniform sampler2D uSrc; uniform vec2 uTx; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy * uTx; vec2 h = uTx;
  vec3 c = texture(uSrc, uv + vec2(-h.x * 2.0, 0)).rgb + texture(uSrc, uv + vec2(-h.x, h.y)).rgb * 2.0
         + texture(uSrc, uv + vec2(0, h.y * 2.0)).rgb + texture(uSrc, uv + vec2(h.x, h.y)).rgb * 2.0
         + texture(uSrc, uv + vec2(h.x * 2.0, 0)).rgb + texture(uSrc, uv + vec2(h.x, -h.y)).rgb * 2.0
         + texture(uSrc, uv + vec2(0, -h.y * 2.0)).rgb + texture(uSrc, uv + vec2(-h.x, -h.y)).rgb * 2.0;
  o = vec4(c / 12.0, 1.0); }`;
const FS_COMP = `#version 300 es
precision highp float; uniform sampler2D uHdr, uFresh, uBloom; uniform vec2 uRes, uRing;
uniform float uBloomK, uExp, uPulse, uT, uBass, uKal, uCA, uRingAge, uPlasma, uMix; out vec4 o;
vec3 rainbow(float h){ return 0.5 + 0.5 * cos(6.2831853 * (h + vec3(0.0, 0.33, 0.67))); }
vec3 soft(vec3 x){ const float k = 0.72; return mix(x, k + (1.0 - k) * (1.0 - exp(-(x - k) / (1.0 - k))), step(k, x)); }
vec2 kal(vec2 uv, float asp){                               // six-fold rotating mirror
  vec2 q = (uv - 0.5) * vec2(asp, 1.0); float r = length(q), a = atan(q.y, q.x + 1e-6) + uT * 0.12;
  const float seg = 6.2831853 / 6.0; a = abs(mod(a, seg) - seg * 0.5);
  return vec2(cos(a), sin(a)) * r / vec2(asp, 1.0) + 0.5; }
vec3 hdrAt(vec2 uv, vec2 dir){                               // crisp particles over their trails, split on the hits
  vec3 tr = vec3(texture(uHdr, uv + dir * uCA).r, texture(uHdr, uv).g, texture(uHdr, uv - dir * uCA).b);
  return texture(uFresh, uv).rgb * (1.0 - uMix) + tr * uMix * 1.1; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; float asp = uRes.x / uRes.y;
  vec2 q = (uv - 0.5) * vec2(asp, 1.0); float r = length(q);
  const float seg = 6.2831853 / 8.0; float am = abs(mod(atan(q.y, q.x + 1e-6) + uT * 0.05, seg) - seg * 0.5);
  vec2 k = vec2(cos(am), sin(am)) * r;                       // a dim kaleidoscopic plasma breathing with the bass
  float pl = sin(k.x * 9.0 + uT * 0.9) + sin(k.y * 13.0 - uT * 1.2) + sin((k.x + k.y) * 7.0 + uT * 0.6) + sin(r * 16.0 - uT * 2.2 - uBass * 3.0);

const STEPS = PUZZLES.map(puzzleSteps);
// How hard the trip hits in each part: feedback trail, rainbow bands, kaleidoscope, background plasma.

const PSY = {
  idle:   { trail: 0.80, rainbow: 0.35, kal: 0.00, plasma: 0.70, mix: 0.38 },
  hello:  { trail: 0.80, rainbow: 0.30, kal: 0.00, plasma: 0.80, mix: 0.38 },
  dance:  { trail: 0.88, rainbow: 0.65, kal: 0.00, plasma: 1.00, mix: 0.42 },
  trip:   { trail: 0.90, rainbow: 0.80, kal: 0.65, plasma: 1.00, mix: 0.60 },
  puzzle: { trail: 0.55, rainbow: 0.12, kal: 0.00, plasma: 0.45, mix: 0.20 },
  laugh:  { trail: 0.86, rainbow: 0.85, kal: 0.35, plasma: 1.00, mix: 0.48 },
  bye:    { trail: 0.82, rainbow: 0.50, kal: 0.20, plasma: 0.90, mix: 0.42 }

let lastStepKey = '', flash = 0, burstT = -1, burstC = [0, 0], propsCenter = [0, 0];
function clipAt(b, clip, startBeat, beats) {      // a looping clip locked to the beat, plus the fraction to the next frame

function direct(t) {

// Before the music starts: Yako waves hello, bouncing gently to an imaginary beat.
function directIdle(t) {

    still(gb % 2 ? STILL.laugh : STILL.wave));
}

// ───────────────────────────── frame ─────────────────────────────
// Pose families: switching inside a family snaps (crisp stop-motion on the beat); switching between
// families makes every particle fly to the new shape.
const familyOf = (l) => l <= 60 ? 1 : l <= 114 ? 2 : (l === STILL.wave || l === STILL.laugh) ? 3 : (l === STILL.neutral || l === STILL.point) ? 4 : 5;
const propsFamily = (pl) => pl < 0 ? 0 : (pl === propsIndex.haha ? 2 : 1);
let yakoX = 0, prevT = 0, lastNow = performance.now(), paused = false, ready = false, HOLD = false, fpsN = 0, fpsT = 0;
let prevYL = -1, prevYX = 0, prevPL = -1, prevPO = [0, 0], prevPS = 1, pFlash = 0;
const psy = Object.assign({}, PSY.idle);
const capEl = $('cap'); let capText = '';
function common(U, d, t) {                         // uniforms both particle passes share, so they agree on every target
  gl.uniform1i(U.uYako, 1); gl.uniform1i(U.uProps, 2);
  gl.uniform1i(U.uYL, d.yl); gl.uniform1i(U.uYL2, d.yl2); gl.uniform1f(U.uYF, d.yf); gl.uniform1i(U.uPL, d.pl);
  gl.uniform2f(U.uYO, yakoX, LAY.feet); gl.uniform1f(U.uYS, LAY.ys);
  gl.uniform2f(U.uPO, d.po[0], d.po[1]); gl.uniform1f(U.uPS, d.ps);
  gl.uniform2f(U.uHalo, yakoX, LAY.feet + LAY.figH * 0.55);
  gl.uniform1f(U.uT, t); gl.uniform1f(U.uA, LAY.A); gl.uniform1f(U.uSea, LAY.sea); gl.uniform1f(U.uBass, lv.bass);
  gl.uniform1i(U.uW, SW); gl.uniform1f(U.uN, N);
}
function frame(now, dtOverride) {
  const dt = dtOverride != null ? dtOverride : Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
  lastNow = now;
  if (!paused) advanceClock(dt);
  readBands();
  const t = playing ? clock : idle;
  const d = playing ? direct(t) : directIdle(t);
  if (FORCE_YL >= 0) { d.yl = FORCE_YL; d.yl2 = FORCE_YL; d.yf = 0; }
  yakoX += (d.x - yakoX) * Math.min(1, dt * 5);
  flash *= Math.exp(-dt * 4); pFlash *= Math.exp(-dt * 7);
  for (const key in psy) psy[key] += (d.psy[key] - psy[key]) * Math.min(1, dt * 2.5);
  if (d.cap !== capText) { capText = d.cap; capEl.textContent = capText; }
  const yMorph = !needInit && prevYL >= 0 && familyOf(prevYL) !== familyOf(d.yl);
  const pMorph = !needInit && propsFamily(prevPL) !== propsFamily(d.pl);
  if (d.pl >= 0 && d.pl !== prevPL) pFlash = 0.7;

  // — simulate —
  gl.bindVertexArray(vao); gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, stateF[1 - cur]); gl.viewport(0, 0, SW, SW);
  const U = P_UPD.u; gl.useProgram(P_UPD.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, state[cur]); gl.uniform1i(U.uState, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, yakoTex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D_ARRAY, propsTex);
  common(U, d, t);
  gl.uniform1i(U.uInit, needInit ? 1 : 0); gl.uniform1i(U.uSnap, SNAP ? 1 : 0);
  gl.uniform1i(U.uYMorph, yMorph ? 1 : 0); gl.uniform1i(U.uYLp, prevYL >= 0 ? prevYL : d.yl); gl.uniform2f(U.uYOp, prevYX, LAY.feet);
  gl.uniform1i(U.uPMorph, pMorph ? 1 : 0); gl.uniform1i(U.uPLp, prevPL); gl.uniform2f(U.uPOp, prevPO[0], prevPO[1]); gl.uniform1f(U.uPSp, prevPS);
  gl.uniform2f(U.uBurstC, burstC[0], burstC[1]); gl.uniform1f(U.uBurstT, burstT);
  gl.uniform1f(U.uPT, paused ? t : Math.min(prevT, t)); gl.uniform1f(U.uDt, paused ? 0 : dt);
  gl.uniform1f(U.uBeatT, d.beatT); gl.uniform1f(U.uAmp, (REDUCED ? 0.1 : 0.34) * d.amp * (playing ? 0.45 + 0.9 * lv.bass : 0.6));
  gl.uniform1f(U.uFeet, LAY.feet); gl.uniform1f(U.uFigH, LAY.figH); gl.uniform1f(U.uSwirl, REDUCED ? 0.4 : 2.8);

function present(t, d) {                          // bloom + composite of the current buffers

let lastD = null, lastT = 0;
function loop(now) { if (ready) { if (HOLD) { if (lastD) present(lastT, lastD); } else frame(now); } requestAnimationFrame(loop); }

// ───────────────────────────── boot ─────────────────────────────
buildState(+$('q').value); buildScreen();
addEventListener('resize', buildScreen);
$('q').addEventListener('change', (e) => buildState(+e.target.value));
$('mute').addEventListener('click', () => { muted = !muted; if (gain) gain.gain.value = muted ? 0 : 1; else song.muted = muted;
  $('mute').textContent = muted ? '🔇' : '🔊'; $('mute').setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music'); });
$('pause').addEventListener('click', () => {
  if (!started) return;
  paused = !paused;
  if (paused) { song.pause(); playing = false; } else { song.play(); playing = true; }
  $('pause').textContent = paused ? '▶' : '⏸'; $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');

$('go').addEventListener('click', async () => {
  setupAudio(); try { await actx.resume(); } catch (e) {}
  try { song.currentTime = 0; await song.play(); playing = true; started = true; clock = 0; prevT = 0; }
  catch (e) { $('st').textContent = 'Tap again to start the music.'; return; }
  $('gate').classList.add('gone');
});
(async () => {
  const prog = (p) => { $('prog').style.width = (p * 100).toFixed(0) + '%'; };
  try {
    await loadYako(prog); $('st').textContent = 'Drawing the puzzles…';
    await loadProps(prog); prog(1);
  } catch (e) { fail('Could not load the animation pictures (' + e.message + ').'); }

  $('go').disabled = false; $('go').textContent = '▶ Start the music'; $('st').textContent = 'Turn your sound up!';

// Hooks for automated checks: render a given song moment deterministically, report stats.
window.__dance = {
  snap(on) { SNAP = !!on; },
  layer(n) { FORCE_YL = n; },
  hold(on) { HOLD = !!on; },
  probe() {                                         // count NaN/Inf in each float buffer

  dir(t) { const d = direct(t); return { yl: d.yl, yl2: d.yl2, yf: +d.yf.toFixed(2), pl: d.pl, cap: d.cap }; },
  stats: () => ({ particles: N, side: SW, ready, layers: { yako: 120, props: propsCount ? propsCount.length : 0 },
    yakoSamples: Array.from(yakoCount.slice(0, 3)), err: gl.getError() }),
  at(t, settle = 90) {                              // simulate the run-up to song time t, draw it, and hold that frame

})();
